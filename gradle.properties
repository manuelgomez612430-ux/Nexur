# Project-wide Gradle settings.
#
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_gradle.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in separate processes in parallel.
# Allows parallel execution of tasks in the same project or across projects.
org.gradle.parallel=true
#
# Android Gradle Plugin can try to optimize your build by caching some information.
# Enabled by default.
org.gradle.caching=true
#
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Configuración de Firma Digital (Release)
MYAPP_RELEASE_STORE_FILE=naxor.jks
MYAPP_RELEASE_STORE_PASSWORD=naxor2026
MYAPP_RELEASE_KEY_ALIAS=naxor_key
MYAPP_RELEASE_KEY_PASSWORD=naxor2026

android.useAndroidX=true
android.enableJetifier=true
android.disallowKotlinSourceSets=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
